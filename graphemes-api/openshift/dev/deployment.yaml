---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: f343b4-dev
  name: graphemes-api
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"graphemes-api:dev","namespace":"f343b4-tools"},"fieldPath":"spec.template.spec.containers[?(@.name==\"container\")].image","paused":false}]
spec:
  selector:
    matchLabels:
      app: graphemes-api
  replicas: 1
  template:
    metadata:
      labels:
        app: graphemes-api
    spec:
      containers:
        - name: container
          image: >-
            image-registry.openshift-image-registry.svc:5000/f343b4-tools/graphemes-api@sha256:63ad0800e3d228f60d7ccf4d6fef93e5e4804e0984259e22606a8359359f8e95
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: crunchy-postgres-pguser-graphemes-api-user
                  key: pgbouncer-host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: crunchy-postgres-pguser-graphemes-api-user
                  key: pgbouncer-port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: crunchy-postgres-pguser-graphemes-api-user
                  key: user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: crunchy-postgres-pguser-graphemes-api-user
                  key: password
            - name: DB_NAME
              # This is a literal value because `crunchy-postgres`
              # is the default database name in the PostgresCluster.
              # This database name does not appear in the Secret.
              value: grapheme_v2
      imagePullSecrets: []
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 50%
  paused: false
